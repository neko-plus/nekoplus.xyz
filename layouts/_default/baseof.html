<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <meta name="keywords" content="{{ .Site.Params.keywords }}">
  <meta name="author" content="{{ .Site.Title }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Site.BaseURL }}">
  <meta property="og:title" content="{{ .Site.Title }}">
  <meta property="og:description" content="{{ .Site.Params.description }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}meta.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ .Site.BaseURL }}">
  <meta name="twitter:title" content="{{ .Site.Title }}">
  <meta name="twitter:description" content="{{ .Site.Params.description }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}meta.png">
  <link rel="icon" href="{{ .Site.BaseURL }}favicon.svg">
  <link rel="preload" href="{{ .Site.BaseURL }}fonts/Zyzol-Bold.otf" as="font" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Zyzol';
      src: url('/fonts/Zyzol-Bold.otf') format('opentype');
    }

    @keyframes drift {
      from {
        background-position: 0 100%;
      }
      to {
        background-position: 0 0;
      }
    }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}

  <script>
    const TARGET = new Date('2026-12-01T00:00:00');
    const SECOND = 1000;
    const MINUTE = SECOND * 60;
    const HOUR = MINUTE * 60;
    const DAY = HOUR * 24;
    const MONTH = DAY * 30.44;

    function updateCountdown() {
      const now = new Date();
      const diff = Math.max(0, TARGET.getTime() - now.getTime());

      const months = Math.floor(diff / MONTH);
      const days = Math.floor((diff % MONTH) / DAY);
      const hours = Math.floor((diff % DAY) / HOUR);
      const minutes = Math.floor((diff % HOUR) / MINUTE);
      const seconds = Math.floor((diff % MINUTE) / SECOND);

      const units = [
        { label: 'Months', value: months },
        { label: 'Days', value: days },
        { label: 'Hours', value: hours },
        { label: 'Minutes', value: minutes },
        { label: 'Seconds', value: seconds }
      ];

      const container = document.getElementById('countdown');
      container.innerHTML = units.map((unit, i) => {
        const value = String(unit.value).padStart(2, '0');
        const separator = i < units.length - 1
          ? '<span class="text-3xl font-bold leading-none text-white/35 sm:text-4xl md:text-5xl lg:text-6xl">:</span>'
          : '';
        return `
          <div class="flex flex-col items-center gap-0.5 sm:gap-1">
            <span class="text-3xl font-bold leading-none text-white sm:text-4xl md:text-5xl lg:text-6xl">${value}</span>
            <span class="text-xs text-white/60">${unit.label}</span>
          </div>
          ${separator}
        `;
      }).join('');
    }

    updateCountdown();
    setInterval(updateCountdown, SECOND);
  </script>
</body>
</html>
